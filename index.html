<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#000F61;
  --navy-soft:#404B88;
  --blue:#0A59EB;
  --blue-700:#073B9D;
  --blue-500:#2870F6;
  --blue-300:#76A4F9;
  --blue-200:#C4D8FD;
  --hl:#C4D8FD;
  --text:#1B1B1E;
  --text-mid:#404B88;
  --text-light:#A1A5C0;
  --border:#E8ECF7;
  --bg:#FFFFFF;
  --bg-soft:#F6F9FF;
  --ease:cubic-bezier(.22,.61,.36,1);
  --nav-h:72px;
}
html{scroll-behavior:smooth;font-size:16px}
body{
  font-family:'Rubik',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.65;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow-x:clip;
}
a{text-decoration:none;color:inherit}

/* ═══════════ TOP NAV ═══════════ */
.nav{
  position:sticky;top:0;z-index:100;height:var(--nav-h);
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(16px,4vw,48px);gap:18px;
}
.brand{display:flex;align-items:center;transition:transform .25s var(--ease)}
.brand:hover{transform:scale(1.04)}
.brand img{height:34px;width:auto;display:block}
.nav-links{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{
  position:relative;white-space:nowrap;
  padding:8px 18px;border-radius:9999px;
  font-size:.97rem;font-weight:600;color:var(--text-mid);
  transition:.22s var(--ease);
}
.nav-links a:hover{color:var(--navy);background:var(--bg-soft)}
.nav-links a.active{color:#fff;background:var(--navy)}
@media(max-width:640px){
  .nav{padding:0 14px;gap:10px}
  .brand img{height:28px}
  .nav-links a{padding:7px 14px;font-size:.9rem}
}

/* ═══════════ HERO ═══════════ */
.hero{
  position:relative;overflow:hidden;text-align:center;
  padding:clamp(76px,11vw,140px) clamp(20px,5vw,48px) clamp(60px,8vw,96px);
  background:linear-gradient(180deg,#EEF4FF 0%, #F7FAFF 46%, #fff 100%);
}
.hero-inner{position:relative;z-index:1;max-width:860px;margin:0 auto}
.hero .accent-line{
  width:60px;height:5px;border-radius:5px;margin:0 auto 28px;
  background:linear-gradient(90deg,var(--blue),var(--blue-300));
}
.hero h1{
  font-size:clamp(2.7rem,7.4vw,4.8rem);font-weight:900;color:var(--navy);
  line-height:1.04;letter-spacing:-.025em;margin-bottom:24px;
}
.hero h1 .hl{
  background:var(--hl);color:var(--navy);
  padding:0 .16em;border-radius:3px;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
}
.hero .lead{font-size:clamp(1.05rem,2.4vw,1.3rem);color:var(--text);max-width:700px;margin:0 auto;font-weight:400;line-height:1.7}

/* ═══════════ SECTIONS ═══════════ */
.container{max-width:1240px;margin:0 auto;padding:0 clamp(20px,5vw,48px)}
.cat-section{padding:clamp(56px,8vw,94px) 0 0;scroll-margin-top:var(--nav-h)}
.cat-section:last-of-type{padding-bottom:clamp(70px,10vw,120px)}
.cat-head{text-align:center;margin-bottom:34px}
.cat-name{font-size:clamp(2.4rem,5.6vw,3.6rem);font-weight:800;color:var(--navy);letter-spacing:-.02em;line-height:1.05}
.cat-line{display:block;width:60px;height:4px;border-radius:4px;margin:18px auto 14px;background:linear-gradient(90deg,var(--blue),var(--blue-300))}
.cat-sub{font-size:clamp(1.05rem,1.9vw,1.35rem);font-weight:600;color:var(--blue)}

  display:grid;grid-template-columns:1.15fr 1fr;gap:30px;align-items:stretch;
  margin:26px 0 40px;
}
@media(max-width:780px){.cat-intro{grid-template-columns:1fr;gap:18px}}

  background:var(--bg-soft);
  border:1px solid var(--border);

.cat-why h3 b{background:var(--hl);color:var(--navy);padding:0 .16em;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.cat-why p{font-size:1rem;color:var(--text);line-height:1.75}
.cat-solutions{
  background:#fff;border:1px solid var(--border);border-radius:22px;padding:26px 30px;
  box-shadow:0 8px 30px rgba(0,15,97,.05);

.cat-solutions h4{

.sol-list{list-style:none;display:flex;flex-direction:column;gap:12px}

.sol-list li .chk{
  flex-shrink:0;width:22px;height:22px;border-radius:50%;margin-top:1px;
  background:var(--blue-200);color:var(--blue);
  display:flex;align-items:center;justify-content:center;
}
.sol-list li .chk svg{width:13px;height:13px}

/* logo grid — no box */
.logo-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:clamp(28px,3.5vw,44px) clamp(20px,2.5vw,32px);margin-top:6px;
}
.logo-item{display:flex;flex-direction:column;align-items:center;text-align:center}
.logo-item.hide{display:none}
.logo-figure{height:96px;width:100%;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.logo-figure img{
  max-width:80%;max-height:72px;width:auto;height:auto;object-fit:contain;display:block;

.logo-item:hover .logo-figure img{transform:scale(1.09)}
.logo-name{display:block;font-weight:700;color:var(--navy);font-size:.95rem;margin-bottom:5px;transition:color .25s var(--ease)}
.logo-item:hover .logo-name{color:var(--blue)}
.logo-desc{font-size:.85rem;color:var(--text-light);line-height:1.5;max-width:230px}

.reveal{opacity:0;transform:translateY(26px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.reveal.in{opacity:1;transform:none}

.top-btn{

.top-btn.v{opacity:1;pointer-events:auto}
.top-btn:hover{background:var(--blue);transform:translateY(-3px)}
</style>

      {logo:'fpai.png', name:'FPAI', desc:'לשכת המתכננים הפיננסיים בישראל'}
    ]
  },
  {
    id:'creators', title:'יוצרי תוכן', dir:'logos/creators',
    why:'יוצרי תוכן, מרצים ומומחים בוחרים בידע כדי להפוך את הידע שלהם למוצר — קורס דיגיטלי במיתוג אישי שאפשר למכור, לשווק ולנהל בקלות. בלי תלות במפתחים: אתם מעלים תוכן, ואנחנו דואגים לחוויית הלמידה, לתשלומים ולשיווק.',
    solutions:[
      'בניית קורס דיגיטלי במיתוג ובדומיין האישי שלכם',
      'מכירת קורסים עם מנגנון תשלומים מובנה',
      'כלי שיווק, דפי נחיתה והרשמה',
      'שיעורי וידאו, שידורים חיים, מבחנים וסקרים',
      'חוויית למידה מושלמת לתלמידים מכל מכשיר',
      'עוזר למידה מבוסס AI ותוכן אינטראקטיבי'
    ],
    clients:[
      {logo:'tom-graziani.png', name:'תום גרציאני', desc:'שחקן קולנוע, טלוויזיה ותיאטרון'},

      {logo:'abu-tableh.png', name:'אבו טבלה', desc:'יוני שרון — סטנדאפיסט ומוזיקאי, יוצר הדמות "אבו טבלה"'},
      {logo:'25-hrs-a-day.png', name:'25 Hrs a Day', desc:'רותי רודנר — תסריטאית, אשת תקשורת ופעילה חברתית'},

];

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

const sections = document.getElementById('sections');
CATEGORIES.forEach(cat=>{
  const sec = document.createElement('section');
  sec.className='cat-section';sec.id=cat.id;

  const cards = cat.clients.map((c,i)=>`
    <div class="logo-item reveal" style="transition-delay:${Math.min(i*40,320)}ms">
      <div class="logo-figure"><img src="${cat.dir}/${c.logo}" alt="${esc(c.name)}" loading="lazy"></div>
      <span class="logo-name">${esc(c.name)}</span>
      <span class="logo-desc">${esc(c.desc)}</span>
    </div>`).join('');

  const sols = cat.solutions.map(s=>`<li><span class="chk">${CHECK}</span><span>${esc(s)}</span></li>`).join('');

  sec.innerHTML=`
    <div class="cat-head reveal">
      <h2 class="cat-name">${esc(cat.title)}</h2>
      <span class="cat-line"></span>
      <p class="cat-sub">למה ${esc(cat.title)} בוחרים בידע</p>
    </div>
    <div class="cat-intro">
      <div class="cat-why reveal">
        <h3>למה בוחרים <b>בנו</b>?</h3>
        <p>${esc(cat.why)}</p>
      </div>
      <div class="cat-solutions reveal">
        <h4>הפתרונות שלנו</h4>
        <ul class="sol-list">${sols}</ul>
      </div>
    </div>
    <div class="logo-grid">${cards}</div>`;
  sections.appendChild(sec);
});

/* scroll reveal */
const revObs = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); revObs.unobserve(e.target);} });
},{rootMargin:'0px 0px -8% 0px',threshold:.08});
document.querySelectorAll('.reveal').forEach(el=>revObs.observe(el));

/* active nav on scroll */
const navLinks = Array.from(document.querySelectorAll('#navLinks a[data-target]'));
const navObs = new IntersectionObserver((entries)=>{
  entries.forEach(en=>{
    if(en.isIntersecting){
      navLinks.forEach(l=>l.classList.toggle('active', l.dataset.target===en.target.id));
    }
  });
},{rootMargin:'-45% 0px -50% 0px'});
CATEGORIES.forEach(c=>navObs.observe(document.getElementById(c.id)));

/* back to top */
const topBtn=document.getElementById('topBtn');
window.addEventListener('scroll',()=>topBtn.classList.toggle('v',window.scrollY>600));
topBtn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
</script>
